spring.application.name=URLShortner
spring.env=${ENV}
spring.app_url=${SERVER_URL}
spring.client_url=${CLIENT_URL}
jwt.secret=${JWT_SECRET}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#server.address=0.0.0.0
#server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Gmail will ignore any fake domain here
app.mail.from-address={SPRING_EMAIL_USERNAME}
spring.mail.username={SPRING_EMAIL_USERNAME}
spring.mail.password={SPRING_EMAIL_PASSWORD}
